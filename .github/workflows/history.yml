name: History

# Fetches the map as it stood on earlier dates, from Overpass, and commits it to the branch.
# Runs when data/history/request.env changes, or by hand.
on:
  push:
    paths:
      - data/history/request.env
  workflow_dispatch:

permissions:
  contents: write

jobs:
  history:
    # Only when the commit pushed edits the request: a new branch carries older commits that did,
    # and a push of it would otherwise fetch again and change what prose was written from.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.modified, 'data/history/request.env') || contains(github.event.head_commit.added, 'data/history/request.env')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch past maps
        run: |
          set -a
          . data/history/request.env
          set +a
          npm run snapshot
      - name: Commit past maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/*.json
          git diff --cached --quiet && { echo "No new past maps"; exit 0; }
          git commit -m "Add past maps as of $(. data/history/request.env && echo "$AS_OF")"
          git push origin "HEAD:${GITHUB_REF_NAME}"
