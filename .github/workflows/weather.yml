name: Weather

# Fetches the weather on the days the map records, from Open-Meteo, and commits it to the branch.
# Runs when data/weather/request.env changes, or by hand.
on:
  push:
    paths:
      - data/weather/request.env
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch weather
        run: |
          set -a
          . data/weather/request.env
          set +a
          npm run weather
      - name: Commit weather
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather/*.json
          git diff --cached --quiet && { echo "Nothing new"; exit 0; }
          git commit -m "Add weather for the snapshot"
          # Another workflow may have pushed data to the branch meanwhile.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
