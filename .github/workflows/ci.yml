name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      # A test is never got out of the way: no fewer here than on the branch this would merge into
      # (or, on main, than before this push), and none skipped, left to do, or run alone.
      - name: No fewer tests than the base
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
          TEST_COUNT_BASE: ../base
        run: |
          git fetch --depth=1 origin "$BASE"
          git worktree add ../base FETCH_HEAD
          ln -s "$PWD/node_modules" ../base/node_modules
          npm run test:count
      - run: npm run build
      # The exported page must play in a real browser, not only pass its tests.
      - name: Export the page
        env:
          SNAPSHOT_PATH: data/snapshots/addiscombe-2026-10-25.json
          START_AT: 51.379897,-0.074294
          HISTORY_DIR: data/history
          WIKIDATA_DIR: data/wikidata
          RECORDS_DIR: data/records
          EXPORT_PATH: site/index.html
        run: npm run export
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
        env:
          EXPORT_PATH: site/index.html
      # And the site as Pages publishes it, the world in tiles, served over http.
      - name: Export the site in tiles
        env:
          SNAPSHOT_PATH: data/snapshots/addiscombe-2026-10-25.json
          START_AT: 51.379897,-0.074294
          HISTORY_DIR: data/history
          WIKIDATA_DIR: data/wikidata
          RECORDS_DIR: data/records
          SITE_DIR: tiled
        run: npm run export
      - run: npm run smoke
        env:
          SITE_DIR: tiled
      # The inline map depends on jsDelivr and OpenFreeMap; say whether it came, without failing on it.
      - run: npm run map-check
        continue-on-error: true
        env:
          EXPORT_PATH: site/index.html
