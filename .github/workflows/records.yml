name: Records

# Fetches other sources' records about the place (food hygiene, listed buildings…), and commits them.
# Runs when data/records/request.env changes, or by hand.
on:
  push:
    # On a branch only: merging one that fetched would otherwise fetch again on main.
    branches-ignore: [main]
    paths:
      - data/records/request.env
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Whether the commit pushed itself edits the request. Asked of git, as a new branch's push event
  # lists no files.
  asked:
    runs-on: ubuntu-latest
    outputs:
      edited: ${{ steps.diff.outputs.edited }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ -n "$(git diff --name-only HEAD~1 HEAD -- data/records/request.env 2>/dev/null)" ]; then
            echo edited=true >> "$GITHUB_OUTPUT"
          else
            echo edited=false >> "$GITHUB_OUTPUT"
          fi
  records:
    needs: asked
    # Only when the commit pushed edits the request (or by hand): a branch that merely carries
    # older commits that did, such as one joining several areas' fetches, fetches nothing again.
    if: github.event_name == 'workflow_dispatch' || needs.asked.outputs.edited == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The borough's snapshots, kept in the private data repository.
      - uses: ./.github/actions/private-data
        with:
          token: ${{ secrets.DATA_TOKEN }}
      - name: Fetch records
        run: |
          set -a
          . data/records/request.env
          set +a
          npm run records
        env:
          # The tree lists run to hundreds of megabytes.
          NODE_OPTIONS: --max-old-space-size=6144
          # Keyed sources: unset, they say so and the rest still fetch.
          EPC_API_KEY: ${{ secrets.EPC_API_KEY }}
          GEOGRAPH_API_KEY: ${{ secrets.GEOGRAPH_API_KEY }}
          # Digital Britannia's GeoPackage, downloaded by hand and kept in the private data repository.
          BRITANNIA_GPKG: .private-data/britannia/digital-britannia_v1.gpkg
      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A place's own folder (RECORDS_OUT in the request), else data/records.
          git add "$(. data/records/request.env && echo "${RECORDS_OUT:-data/records}")"/*.json
          git diff --cached --quiet && { echo "Nothing new"; exit 0; }
          git commit -m "Add records: $(. data/records/request.env && echo "$SOURCES")"
          # Another workflow may have pushed data to the branch meanwhile.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
