name: Records

# Fetches other sources' records about the place (food hygiene, listed buildings…), and commits them.
# Runs when data/records/request.env changes, or by hand.
on:
  push:
    paths:
      - data/records/request.env
  workflow_dispatch:

permissions:
  contents: write

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch records
        run: |
          set -a
          . data/records/request.env
          set +a
          npm run records
        env:
          # The tree lists run to hundreds of megabytes.
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/records/*.json
          git diff --cached --quiet && { echo "Nothing new"; exit 0; }
          git commit -m "Add records: $(. data/records/request.env && echo "$SOURCES")"
          # Another workflow may have pushed data to the branch meanwhile.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
