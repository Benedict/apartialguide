name: Snapshot

# Takes a dated OSM snapshot and commits it to the branch. Runs when data/snapshots/request.env
# (the area to fetch) changes, or by hand.
on:
  push:
    paths:
      - data/snapshots/request.env
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Whether the commit pushed itself edits the request. Asked of git, as a new branch's push event
  # lists no files.
  asked:
    runs-on: ubuntu-latest
    outputs:
      edited: ${{ steps.diff.outputs.edited }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ -n "$(git diff --name-only HEAD~1 HEAD -- data/snapshots/request.env 2>/dev/null)" ]; then
            echo edited=true >> "$GITHUB_OUTPUT"
          else
            echo edited=false >> "$GITHUB_OUTPUT"
          fi
  snapshot:
    needs: asked
    # Only when the commit pushed edits the request (or by hand): a branch that merely carries
    # older commits that did, such as one joining several areas' fetches, fetches nothing again.
    if: github.event_name == 'workflow_dispatch' || needs.asked.outputs.edited == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Take snapshot
        run: |
          set -a
          . data/snapshots/request.env
          set +a
          npm run snapshot
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          git diff --cached --quiet && { echo "No new snapshot"; exit 0; }
          git commit -m "Add OSM snapshot $(date -u +%F)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
