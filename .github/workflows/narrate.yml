name: Narrate

# Writes each stop's prose ahead of time with a Claude model and commits it. Started by hand.
# Needs the ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Most stops to write in this run (each is one model call)
        required: true
        default: '25'
      only:
        description: Which stops to write, busier (something going on; the template carries the rest) or all
        required: true
        default: busier
        type: choice
        options:
          - busier
          - all
      area:
        description: Which area to write, by its name in data/areas.json (Addiscombe, Shirley…); empty for all
        required: false
        default: Addiscombe

permissions:
  contents: write
  actions: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The borough's snapshots, kept in the private data repository.
      - uses: ./.github/actions/private-data
        with:
          token: ${{ secrets.DATA_TOKEN }}
      - name: Check the API key is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || {
            echo "::error::Add ANTHROPIC_API_KEY under Settings → Secrets and variables → Actions"
            exit 1
          }
      - name: Write prose
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NARRATE_LIMIT: ${{ inputs.limit }}
          NARRATE_ONLY: ${{ inputs.only }}
          NARRATE_AREA: ${{ inputs.area }}
          # The same world the Deploy workflow publishes, or the prose will not be found.
          SNAPSHOT_PATH: data/snapshots/croydon-2026-10-29.json.gz
          NODE_OPTIONS: --max-old-space-size=6144
          START_AT: 51.379897,-0.074294
          HISTORY_DIR: data/history
          WIKIDATA_DIR: data/wikidata
          RECORDS_DIR: data/records
          NARRATION_PATH: data/narration/addiscombe.json
        run: npm run narrate
      - name: Commit prose
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/narration
          git diff --cached --quiet && { echo "No new prose"; exit 0; }
          git commit -m "Add narration written by the Narrate workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      # A push by this workflow starts no other, so it asks for the page to be published again.
      - name: Publish the page with the new prose
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
