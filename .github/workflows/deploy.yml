name: Deploy

# Builds the site (the microsite, and the walk in tiles fetched as the reader reaches them), checks
# that it plays, and publishes it where live data can be fetched as the reader plays (the claude.ai
# preview's security policy blocks it). Once Netlify is set up (the variable NETLIFY_SITE_ID and the
# secret NETLIFY_AUTH_TOKEN), main goes to production there and a pull request labelled preview to a
# preview of its own; until then, main goes to GitHub Pages, as before.
on:
  push:
    branches: [main]
  # A pull request gets a preview only when labelled preview: most merge before anyone would open one.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A pull request is built only for a preview, asked for by its label: CI checks it otherwise.
    if: >-
      github.event_name != 'pull_request' ||
      (vars.NETLIFY_SITE_ID != '' && contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The borough's snapshots, kept in the private data repository.
      - uses: ./.github/actions/private-data
        with:
          token: ${{ secrets.DATA_TOKEN }}
      - name: Export the site
        env:
          # The whole borough, enriched area by area (data/areas.json); the walk starts in Addiscombe.
          SNAPSHOT_PATH: data/snapshots/croydon-2026-10-29.json.gz
          START_AT: 51.379897,-0.074294
          # The borough's map, of which only the areas open to walk are compiled.
          NODE_OPTIONS: --max-old-space-size=6144
          HISTORY_DIR: data/history
          WIKIDATA_DIR: data/wikidata
          RECORDS_DIR: data/records
          NARRATION_PATH: data/narration/addiscombe.json
          SITE_DIR: site
          # Every open area must have a door inside it on the borough's map.
          DOORS_REQUIRED: 1
          # On Netlify the flights function answers from the same site (netlify/edge-functions);
          # on Pages, from wherever it was deployed on its own, if anywhere.
          FLIGHTS_URL: ${{ vars.NETLIFY_SITE_ID != '' && '/api/flights' || vars.FLIGHTS_URL }}
          # The day's news of the place, from the site's own function on Netlify; elsewhere none.
          NEWS_URL: ${{ vars.NETLIFY_SITE_ID != '' && '/api/news' || '' }}
          # Feedback, filed by the site's own function on Netlify (its token Netlify's alone); elsewhere none.
          FEEDBACK_URL: ${{ vars.NETLIFY_SITE_ID != '' && '/api/feedback' || '' }}
          # Google Analytics, counted only once a reader says yes; without it nothing is asked.
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          # The site's own address, for the image shown where it is shared; without it none is named.
          SITE_URL: ${{ vars.SITE_URL }}
          # Where a reader at the edge of an area not open yet may ask to hear when it opens.
          SIGNUP_URL: ${{ vars.SIGNUP_URL }}
          # Where a reader may write about their data, on the privacy page.
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: npm run export
      # Publish only a site that plays.
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
        env:
          SITE_DIR: site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  netlify:
    needs: build
    if: vars.NETLIFY_SITE_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # For netlify.toml and the edge function, deployed with the site.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@27.12.1 deploy --no-build --dir=site --site "$NETLIFY_SITE_ID" \
            ${{ github.ref == 'refs/heads/main' && '--prod' || format('--alias=pr-{0}', github.event.number) }} \
            --message "${{ github.sha }}" --json > deploy.json
          echo "Deployed: $(jq -r '.deploy_url' deploy.json)" >> "$GITHUB_STEP_SUMMARY"

  pages:
    needs: build
    if: vars.NETLIFY_SITE_ID == '' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
